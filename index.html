<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자투리 영단어</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2f5bea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="자투리 영단어">
<style>
:root{--bg:#f6f7fb;--card:#fff;--fg:#1f2430;--sub:#5d6475;--line:#e2e5ee;--accent:#2f5bea;--accent-fg:#fff;--ok:#1f8a4c;--soft:#eaf0ff}
@media (prefers-color-scheme:dark){:root{--bg:#12141a;--card:#1b1e27;--fg:#eceef4;--sub:#a3a9ba;--line:#2c3140;--accent:#7b9bff;--accent-fg:#0d1020;--ok:#5fd18a;--soft:#232a44}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 "Malgun Gothic","Apple SD Gothic Neo",sans-serif}
.wrap{max-width:680px;margin:0 auto;padding:0 16px 110px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 8px;border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:baseline}
h1{font-size:19px;margin:0}
.stat{font-size:13px;color:var(--sub)}
.tabs{display:flex;gap:8px;margin:10px 0 8px}
.tab{flex:1;min-height:44px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;font:inherit;cursor:pointer}
.tab[aria-selected=true]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:bold}
.tab small{opacity:.8;margin-left:4px}
.prog{font-size:13px;color:var(--sub);display:flex;justify-content:space-between}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:12px;transition:opacity .2s}
.card.done{opacity:.55}
.row1{display:flex;align-items:center;gap:8px}
.word{font:600 27px Georgia,"Times New Roman",serif}
.ipa{color:var(--sub);font-size:14px;margin-left:2px}
.spacer{flex:1}
button{font:inherit;color:inherit}
.spk{min-width:44px;min-height:44px;border:0;background:var(--soft);color:var(--accent);border-radius:50%;cursor:pointer;font-size:18px;flex:none}
.spk.on{background:var(--accent);color:var(--accent-fg);animation:pulse .8s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.dn{min-height:44px;padding:0 14px;border:1px solid var(--accent);color:var(--accent);background:none;border-radius:10px;cursor:pointer;margin-left:8px}
.card.done .dn{border-color:var(--ok);color:var(--ok)}
.mean{margin:6px 0 0;padding:0;list-style:none}
.mean b{color:var(--accent)}
hr{border:0;border-top:1px solid var(--line);margin:10px 0}
.ex{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px}
.ex .spk{min-width:44px}
.ex p{margin:8px 0 0;font-family:Georgia,serif}
.ko{display:none;color:var(--sub);font:15px "Malgun Gothic",sans-serif!important;margin-top:2px!important}
.ko.open{display:block}
.note{font-size:12px;color:var(--sub);margin-top:4px}
.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.next{display:block;width:100%;max-width:680px;margin:0 auto;min-height:50px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-fg);font-size:17px;font-weight:bold;cursor:pointer}
.next.hl{box-shadow:0 0 0 3px var(--soft),0 0 0 5px var(--accent)}
.finish{text-align:center;padding:40px 10px}
.finish button,.reset{min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-fg);cursor:pointer;margin:4px}
.reset.ghost{background:none;color:var(--sub);border-color:var(--line);font-size:13px;min-height:36px}
.toast{background:var(--soft);border-radius:10px;padding:8px 12px;margin-top:10px;font-size:14px}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="top"><h1>🧩 자투리 영단어</h1><div class="stat" id="stat"></div></div>
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="prog"><span id="pt"></span><span id="pg"></span></div>
    <div class="bar"><i id="bar"></i></div>
  </header>
  <div id="toast"></div>
  <main id="list"></main>
  <div style="text-align:center;margin-top:18px"><span id="resetArea"></span></div>
  <div style="text-align:center;margin-top:10px" id="install"></div>
</div>
<div class="bottom"><button class="next" id="next">다음 5개 →</button></div>

const TIERS={
middle:[["borrow","habit","shy","village","health","goal","invite","lonely","polite","travel"],["journey","neighbor","century","decide","exercise","festival","promise","protect","receive","repeat"],["comfortable","environment","imagine","knowledge","manage","necessary","observe","recycle","report","succeed"]],

for(const lv in WORDS)WORDS[lv].forEach(w=>{w.tier=TIERS[lv].findIndex(t=>t.includes(w.word))+1||2;});
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
// 쉬운 단어 → 어려운 단어 순서, 같은 난이도 안에서는 무작위
function makeOrder(lv){return [1,2,3].flatMap(t=>shuffle(WORDS[lv].filter(w=>w.tier===t).map(w=>w.id)));}
function orderedList(lv){const m=Object.fromEntries(WORDS[lv].map(w=>[w.id,w]));return S.levels[lv].order.map(id=>m[id]);}

/* ---------- 저장 ---------- */
const KEY="jatuori-vocab:v1";
let S,canSave=true,warned=false;
function load(){
  let o=null;
  try{o=JSON.parse(localStorage.getItem(KEY));}catch(e){canSave=false;}
  if(!o||o.version!==1){o={version:1,lastLevel:"middle",levels:{},daily:{}};}
  for(const lv in LEVELS){const L=o.levels[lv]||(o.levels[lv]={done:[],cursor:0});
    const ids=new Set(WORDS[lv].map(w=>w.id));
    L.done=(L.done||[]).filter(id=>ids.has(id));
    const ok=Array.isArray(L.order)&&L.order.length===ids.size&&L.order.every(id=>ids.has(id))&&new Set(L.order).size===ids.size;
    if(!ok){L.order=makeOrder(lv);L.cursor=0;}
    if(!(L.cursor>=0)||L.cursor>=WORDS[lv].length)L.cursor=0;}
  if(!LEVELS[o.lastLevel])o.lastLevel="middle";
  o.daily=o.daily||{};
  return o;
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));}
  catch(e){canSave=false;if(!warned){warned=true;toast("이 브라우저에서는 완료 기록이 저장되지 않아요. 시크릿 모드를 끄고 열어 주세요.");}}
}
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
function trimDaily(){const k=Object.keys(S.daily).sort().reverse().slice(60);k.forEach(x=>delete S.daily[x]);}
function streak(){let n=0,d=new Date();const f=x=>x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
  if(!S.daily[f(d)])d.setDate(d.getDate()-1);
  while(S.daily[f(d)]>0){n++;d.setDate(d.getDate()-1);}return n;}

/* ---------- 세트 구성 (PRD 7.3) ---------- */
let cur={ids:[],last:0};
function compute(){
  const lv=S.lastLevel,L=S.levels[lv],list=orderedList(lv),N=list.length,done=new Set(L.done);
  const ids=[];let last=L.cursor;
  for(let k=0;k<N&&ids.length<5;k++){const i=(L.cursor+k)%N;if(!done.has(list[i].id)){ids.push(list[i].id);last=i;}}
  cur={ids,last};
}

/* ---------- 음성 (PRD 8) ---------- */
const hasTTS="speechSynthesis" in window;
let voice=null,speakTok=0,activeBtn=null,ttsNoted=false;
function pickVoice(){
  if(!hasTTS)return;const vs=speechSynthesis.getVoices();if(!vs.length)return;
  const us=vs.filter(v=>/^en[-_]US/i.test(v.lang)),en=vs.filter(v=>/^en/i.test(v.lang));
  const pool=us.length?us:en;
  voice=pool.find(v=>/natural|neural|premium|enhanced/i.test(v.name))||pool.find(v=>/Google US English|Samantha|Aria|Jenny/i.test(v.name))||pool[0]||null;
}
if(hasTTS){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function stopSpeak(){speakTok++;if(hasTTS)speechSynthesis.cancel();if(activeBtn){activeBtn.classList.remove("on");activeBtn=null;}}
function say(text,rates,btn){
  stopSpeak();
  if(!hasTTS){if(!ttsNoted){ttsNoted=true;toast("이 브라우저는 발음 듣기를 지원하지 않아요. 크롬이나 사파리에서 열어 주세요.");}return;}
  const tok=speakTok;activeBtn=btn;btn.classList.add("on");
  const plain=text.replace(/\*/g,"");
  let i=0;
  const run=()=>{
    if(tok!==speakTok)return;
    const u=new SpeechSynthesisUtterance(plain);u.lang="en-US";if(voice)u.voice=voice;u.rate=rates[i];
    u.onend=()=>{if(tok!==speakTok)return;i++;if(i<rates.length)setTimeout(run,600);else{btn.classList.remove("on");if(activeBtn===btn)activeBtn=null;}};
    u.onerror=()=>{if(tok===speakTok){btn.classList.remove("on");}};
    speechSynthesis.speak(u);
  };
  run();
}
document.addEventListener("visibilitychange",()=>{if(document.hidden)stopSpeak();});

function remaining(lv){return WORDS[lv].length-S.levels[lv].done.length;}

function renderHead(){
  const lv=S.lastLevel,N=WORDS[lv].length,dn=S.levels[lv].done.length;
  $("tabs").innerHTML=Object.keys(LEVELS).map(k=>`<button class="tab" role="tab" aria-selected="${k===lv}" data-lv="${k}">${LEVELS[k]}<small>${remaining(k)}</small></button>`).join("");
  $("stat").textContent="오늘 "+(S.daily[today()]||0)+"개 · 연속 "+streak()+"일";
  $("pt").textContent="완료 "+dn+" / "+N;
  $("pg").textContent=(S.daily[today()]||0)>=5?"🎯 오늘 목표 달성":"오늘 목표 5개";
  $("bar").style.width=(N?dn/N*100:0)+"%";
}
function renderList(){
  const lv=S.lastLevel,L=S.levels[lv],list=WORDS[lv],byId=Object.fromEntries(list.map(w=>[w.id,w]));
  if(!cur.ids.length){
    $("list").innerHTML=`<div class="finish"><div style="font-size:48px">🎉</div><p>${LEVELS[lv]} 단어 ${list.length}개를 모두 완료했어요.<br>처음부터 다시 복습할까요?</p><button id="again">처음부터 다시</button></div>`;
    $("again").onclick=()=>{L.done=[];L.cursor=0;L.order=makeOrder(lv);save();compute();render();};
    $("resetArea").innerHTML="";$("next").style.display="none";return;
  }
  $("next").style.display="block";
  $("list").innerHTML=cur.ids.map(id=>{
    const w=byId[id],d=L.done.includes(id);
    return `<article class="card ${d?"done":""}" data-id="${id}">
      <div class="row1"><span class="word">${esc(w.word)}</span>
        <button class="spk" data-say="w" aria-label="${esc(w.word)} 발음 듣기">🔊</button><span class="spacer"></span>
        <button class="dn" data-done aria-label="${esc(w.word)} ${d?"완료 취소":"완료"}">${d?"✓ 완료됨 · 취소":"완료"}</button></div>
      <div class="ipa">${esc(w.ipa)}</div>
      <ol class="mean">${w.meanings.map((m,i)=>`<li>${i+1}. <b>[${m[0]}]</b> ${esc(m[1])}</li>`).join("")}</ol>
      ${d?'<div class="note">다음부터 숨김</div>':""}<hr>
      ${w.examples.map((e,i)=>`<div class="ex"><button class="spk" data-say="e${i}" aria-label="예문 ${i+1} 듣기">🔊</button>
        <div><p>${bold(e[0])}</p><p class="ko" data-ko="${i}">${esc(e[1])}</p></div></div>`).join("")}
    </article>`;}).join("");
  const allDone=cur.ids.every(id=>L.done.includes(id));
  $("next").classList.toggle("hl",allDone);
  $("resetArea").innerHTML='<button class="reset ghost" id="rst">이 단계 초기화</button>';
  $("rst").onclick=()=>{$("resetArea").innerHTML=`<span class="stat">${LEVELS[lv]} 단계의 완료 기록 ${L.done.length}개가 지워져요.</span> <button class="reset" id="rok">초기화</button><button class="reset ghost" id="rno">취소</button>`;
    $("rok").onclick=()=>{L.done=[];L.cursor=0;L.order=makeOrder(lv);save();stopSpeak();compute();render();};$("rno").onclick=renderList;};
}
function render(){renderHead();renderList();}

/* ---------- 이벤트 ---------- */
$("list").addEventListener("click",e=>{
  const card=e.target.closest(".card");if(!card)return;
  const id=card.dataset.id,lv=S.lastLevel,L=S.levels[lv],w=WORDS[lv].find(x=>x.id===id);
  const sp=e.target.closest("[data-say]");
  if(sp){const k=sp.dataset.say;
    if(k==="w")say(w.word,[0.9,0.75],sp);
    else{const i=+k[1];card.querySelector(`[data-ko="${i}"]`).classList.add("open");say(w.examples[i][0],[0.9],sp);}
    return;}
  if(e.target.closest("[data-done]")){
    const t=today(),idx=L.done.indexOf(id);
    if(idx<0){L.done.push(id);S.daily[t]=(S.daily[t]||0)+1;}
    else{L.done.splice(idx,1);if(S.daily[t]>0)S.daily[t]--;}
    trimDaily();save();
    // 카드는 제자리에 두고 상태만 갱신 (열린 해석 유지)
    const open=[...card.querySelectorAll(".ko.open")].map(x=>x.dataset.ko);
    renderHead();renderList();
    const nc=document.querySelector(`.card[data-id="${id}"]`);
    if(nc)open.forEach(i=>nc.querySelector(`[data-ko="${i}"]`).classList.add("open"));
  }
});
$("tabs").addEventListener("click",e=>{
  const b=e.target.closest("[data-lv]");if(!b||b.dataset.lv===S.lastLevel)return;
  stopSpeak();S.lastLevel=b.dataset.lv;save();compute();render();window.scrollTo(0,0);
});
$("next").onclick=()=>{
  stopSpeak();const L=S.levels[S.lastLevel];L.cursor=(cur.last+1)%WORDS[S.lastLevel].length;save();compute();render();window.scrollTo(0,0);
};
window.addEventListener("storage",e=>{if(e.key===KEY){const keep=S.lastLevel;S=load();S.lastLevel=keep;compute();render();}});

S=load();compute();render();

/* ---------- 오프라인 · 홈 화면 추가 ---------- */
if("serviceWorker" in navigator&&location.protocol!=="file:"){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
let installEvt=null;
window.addEventListener("beforeinstallprompt",e=>{
  e.preventDefault();installEvt=e;
  if(matchMedia("(display-mode: standalone)").matches)return;
  $("install").innerHTML='<button class="reset ghost" id="inst">📲 홈 화면에 추가</button>';
  $("inst").onclick=async()=>{installEvt.prompt();await installEvt.userChoice;installEvt=null;$("install").innerHTML="";};
});
window.addEventListener("appinstalled",()=>{$("install").innerHTML="";});
// iOS 사파리는 설치 버튼이 없어 안내만 보여 준다
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;
if(isIOS&&!navigator.standalone){
  $("install").innerHTML='<div class="stat">📲 홈 화면에 추가: 사파리 하단 <b>공유</b> 버튼 → <b>홈 화면에 추가</b></div>';
}
</script>
</body>
</html>
